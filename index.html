<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f2a36">
<title>Maintenance Planner</title>
<!-- Server settings. Fill in config.js to share data between computers (see README). -->
<script src="config.js"></script>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Sans+Georgian:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: sidebar navigation on desktop, bottom tab bar on phones; the site plan is the home screen, work orders are pins on it. */
:root{
  --bg:#E8ECEF; --surface:#F7F9FA; --surface-2:#DEE4E8; --ink:#15232D; --muted:#566874; --line:#C3CDD4;
  --accent:#F2A900; --accent-ink:#1A1400; --steel:#245A7C; --steel-soft:#D5E3EC;
  --crit:#C3352B; --warn:#C77E00; --ok:#2B8251; --hold:#6A7884;
  --pl-ground:#EEF1F2; --pl-bldg:#D4DCE1; --pl-bldg-line:#93A3AE; --pl-belt:#2B3A44; --pl-water:#BFD5E2; --pl-label:#3A4C58; --pl-quay:#C9CFD3;
  --shadow:0 1px 2px rgba(21,35,45,.08),0 6px 20px rgba(21,35,45,.10);
  --grid-line:rgba(40,52,62,.28);--nav-bg:#15232D;--grid-label:rgba(30,42,52,.75);
  --f-display:"Barlow Semi Condensed","IBM Plex Sans Condensed","Noto Sans Georgian","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow","IBM Plex Sans","Noto Sans Georgian",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F171D; --surface:#16212A; --surface-2:#1F2C36; --ink:#E3E9ED; --muted:#93A4AF; --line:#2B3A45;
  --accent:#F2B01E; --accent-ink:#1A1400; --steel:#7DB3D6; --steel-soft:#1E3444;
  --crit:#E8685D; --warn:#EFA73A; --ok:#4FBC80; --hold:#8E9CA7;
  --pl-ground:#131D24; --pl-bldg:#22313C; --pl-bldg-line:#465966; --pl-belt:#C9D4DB; --pl-water:#173244; --pl-label:#AFBFCA; --pl-quay:#2A3640;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);--nav-bg:#0A1217; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F171D; --surface:#16212A; --surface-2:#1F2C36; --ink:#E3E9ED; --muted:#93A4AF; --line:#2B3A45;
  --accent:#F2B01E; --accent-ink:#1A1400; --steel:#7DB3D6; --steel-soft:#1E3444;
  --crit:#E8685D; --warn:#EFA73A; --ok:#4FBC80; --hold:#8E9CA7;
  --pl-ground:#131D24; --pl-bldg:#22313C; --pl-bldg-line:#465966; --pl-belt:#C9D4DB; --pl-water:#173244; --pl-label:#AFBFCA; --pl-quay:#2A3640;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);--nav-bg:#0A1217; color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--steel);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:.01em}
code,.mono{font-family:var(--f-mono);font-size:.82em;letter-spacing:0}
.app{display:grid;grid-template-columns:1fr;min-height:100%}
@media (min-width:900px){.app{grid-template-columns:232px minmax(0,1fr)}}

/* sidebar / tab bar */
.nav{background:var(--nav-bg);color:#F7F9FA;display:none}
@media (min-width:900px){.nav{display:flex;flex-direction:column;gap:4px;padding:20px 12px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;height:100dvh}}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px}
.brand-mark{width:30px;height:30px;border-radius:6px;background:var(--accent);display:grid;place-items:center;flex:none}
.brand-name{font-family:var(--f-display);font-weight:700;font-size:19px;line-height:1.1;letter-spacing:.02em;color:#F7F9FA}
.brand-sub{font-size:12px;letter-spacing:.04em;font-weight:600;color:#9FB0BB}
.nav button{display:flex;align-items:center;gap:12px;background:none;border:0;color:#C9D4DB;padding:10px 10px;border-radius:8px;text-align:left;font-weight:500}
.nav button:hover{background:rgba(255,255,255,.06);color:#fff}
.nav button[aria-current="page"]{background:rgba(242,169,0,.14);color:#FFD36B}
.nav .nav-count{margin-left:auto;font-family:var(--f-mono);font-size:11px;background:rgba(255,255,255,.1);padding:1px 7px;border-radius:10px}
.nav .spacer{flex:1}
.nav .me-chip{gap:10px;margin:4px 0 6px;padding:8px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.04)}
.me-av{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:12px;letter-spacing:.02em}
.me-av.ro{background:#9FB0BB;color:#15232D}
.me-txt{display:grid;min-width:0;line-height:1.25}.me-txt b{color:#F7F9FA;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me-txt small{color:#9FB0BB;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me-av-btn{font-weight:700;font-size:12px;background:var(--accent);color:var(--accent-ink);border-color:var(--accent);border-radius:50%}.me-av-btn.ro{background:var(--surface-2);color:var(--ink);border-color:var(--line)}
.ico{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(6,1fr);padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px))}
@media (min-width:900px){.tabbar{display:none}}
.tabbar button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;font-size:11px;font-weight:600;color:var(--muted);border-radius:8px}
.tabbar button[aria-current="page"]{color:var(--steel)}
.tabbar button[aria-current="page"] .ico{stroke:var(--steel)}

/* main */
.main{min-width:0;padding-inline:16px;padding-block:16px 96px}
@media (min-width:900px){.main{padding-inline:28px;padding-block:24px 40px}}
.topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.topbar h1{font-size:28px;font-weight:700;line-height:1.1}
.topbar .sub{color:var(--muted);font-size:13px}
.topbar .grow{flex:1}
.mobile-brand{display:flex;align-items:center;gap:8px}
@media (min-width:900px){.mobile-brand{display:none}}

.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;font-weight:600;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.05)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--crit);border-color:color-mix(in srgb,var(--crit) 40%,var(--line))}
.btn.sm{padding:5px 10px;font-size:13px}
.btn .ico{width:17px;height:17px}
.iconbtn{border:1px solid var(--line);background:var(--surface);width:36px;height:36px;border-radius:8px;display:grid;place-items:center}

.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:6px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--steel-soft);color:var(--ink)}
select.sel,input.search{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;font-size:13px;max-width:100%}
input.search{min-width:0;width:220px}
.check{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);font-weight:500}

/* plan */
.plan-layout{display:grid;gap:16px;grid-template-columns:minmax(0,1fr);align-items:start}
@media (min-width:1200px){.plan-layout{grid-template-columns:minmax(0,1fr) 340px}}
.plan-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;position:relative;min-width:0}
.plan-scroll{overflow:auto;max-height:72vh;-webkit-overflow-scrolling:touch}
.plan-canvas{position:relative;min-width:100%;background:#fff;--pl-ground:#EEF1F2;--pl-bldg:#D4DCE1;--pl-bldg-line:#93A3AE;--pl-belt:#2B3A44;--pl-water:#BFD5E2;--pl-label:#3A4C58;--pl-quay:#C9CFD3}
.plan-canvas>svg,.plan-canvas>img.plan-img{filter:grayscale(1) contrast(.92);opacity:.58}
.plan-grid{position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(to right,var(--grid-line) 1px,transparent 1px),linear-gradient(to bottom,var(--grid-line) 1px,transparent 1px);background-size:calc(100% / 12) calc(100% / 8);box-shadow:inset -1px -1px 0 var(--grid-line)}
.plan-grid span{position:absolute;font:600 10px/1 var(--f-mono);color:var(--grid-label);transform:translate(-50%,0);padding:3px 0}
.plan-grid span.r{transform:translate(0,-50%);padding:0 4px}
.plan-canvas svg,.plan-canvas img.plan-img{display:block;width:100%;height:auto;max-width:none}
.plan-canvas.placing{cursor:crosshair}
.pins{position:absolute;inset:0}
.placing-banner{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:14px}
.placing-banner .grow{flex:1}
.plan-foot{display:flex;flex-wrap:wrap;gap:6px 16px;padding:10px 14px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.lg{display:inline-flex;align-items:center;gap:6px}
.lg i{width:10px;height:10px;border-radius:50%;display:inline-block}
.zoom{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:4px;z-index:3}
.zoom button{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:18px;box-shadow:var(--shadow)}

.pin{position:absolute;transform:translate(calc(-50% + var(--ox,0px)),calc(-50% + var(--oy,0px)));width:24px;height:24px;border-radius:50%;border:3px solid var(--surface);background:var(--c,var(--crit));box-shadow:0 1px 4px rgba(0,0,0,.35);padding:0;display:grid;place-items:center;color:#fff;font:700 11px/1 var(--f-display);z-index:2}
.pin:hover,.pin.sel{transform:translate(calc(-50% + var(--ox,0px)),calc(-50% + var(--oy,0px))) scale(1.3);z-index:4}
.pin.sel{outline:3px solid var(--steel);outline-offset:1px}
.pin.crit-p::after{content:"";position:absolute;inset:-16.5px;border-radius:50%;border:2.5px solid var(--c);pointer-events:none;opacity:.6;animation:pulse 1.8s ease-out infinite}
@keyframes pulse{from{transform:scale(.6);opacity:.8}to{transform:scale(1.25);opacity:0}}
@media (prefers-reduced-motion:reduce){.pin.crit-p::after{animation:none;opacity:.5}}
.eqm{position:absolute;transform:translate(-5px,-5px);display:flex;align-items:center;gap:4px;background:none;border:0;padding:0;z-index:1}
.eqm i{width:10px;height:10px;transform:rotate(45deg);background:var(--surface);border:2px solid var(--steel);flex:none}
.eqm span{font:500 10px/1 var(--f-mono);background:color-mix(in srgb,var(--surface) 88%,transparent);color:var(--steel);padding:2px 4px;border-radius:3px;white-space:nowrap}
.eqm:hover i{background:var(--steel)}

/* svg plan */
.pl-ground{fill:var(--pl-ground)}
.pl-bldg{fill:var(--pl-bldg);stroke:var(--pl-bldg-line);stroke-width:1.5}
.pl-water{fill:var(--pl-water)}
.pl-quay{fill:var(--pl-quay);stroke:var(--pl-bldg-line);stroke-width:1}
.pl-belt{stroke:var(--pl-belt);stroke-width:5;fill:none;stroke-linecap:round}
.pl-belt-dash{stroke:var(--pl-belt);stroke-width:5;fill:none;stroke-dasharray:2 7;opacity:.35}
.pl-rail{stroke:var(--pl-bldg-line);stroke-width:2;fill:none;stroke-dasharray:10 5}
.pl-road{stroke:var(--pl-bldg-line);stroke-width:14;fill:none;opacity:.25;stroke-linecap:round}
.pl-node{fill:var(--pl-belt)}
.pl-label{fill:var(--pl-label);font:600 15px var(--f-display);letter-spacing:.02em}
.pl-small{fill:var(--pl-label);font:500 12px var(--f-mono);opacity:.85}
.pl-water-label{fill:var(--pl-label);font:600 14px var(--f-display);letter-spacing:.2em;opacity:.7}
.pl-grid{stroke:var(--pl-bldg-line);stroke-width:.5;opacity:.25}

/* side list */
.side{background:var(--surface);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;min-width:0;max-height:calc(72vh + 44px)}
.side-head{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;align-items:baseline;gap:8px}
.side-head h2{font-size:17px}
.side-list{overflow:auto;padding:6px}
.empty{padding:28px 18px;text-align:center;color:var(--muted)}
.empty h3{color:var(--ink);font-size:19px;margin-bottom:6px}
.empty p{margin:0 auto 14px;max-width:44ch}
.empty .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}

/* work order rows */
.wo-list{display:flex;flex-direction:column;gap:6px}
.wo-list>*,.dr-body>*,.drawer>*{flex:none}
.drawer>.dr-body{flex:1 1 auto;min-height:0}
.wo{display:grid;grid-template-columns:4px minmax(0,1fr) auto;gap:12px;align-items:stretch;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:0;overflow:hidden;width:100%}
.side .wo{border-color:transparent}
.wo:hover{border-color:var(--muted)}
.wo.sel{border-color:var(--steel);box-shadow:0 0 0 1px var(--steel)}
.wo-stripe{background:var(--p)}
.wo-main{padding:10px 0;min-width:0;display:flex;flex-direction:column;gap:2px}
.wo-top{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:12px}
.wo-title{font-weight:600;font-size:15px;line-height:1.3;overflow-wrap:anywhere}
.wo-meta{color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wo-side{padding:10px 12px 10px 0;display:flex;flex-direction:column;align-items:flex-end;gap:6px;font-size:12px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--c);white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c)}
.tag{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);padding:0 6px;border-radius:4px}
.tag.sched{color:var(--steel);border-color:color-mix(in srgb,var(--steel) 45%,var(--line))}
.tag.demo{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,var(--line))}
.due{color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.due.over{color:var(--crit);font-weight:600}
.due.soon{color:var(--warn);font-weight:600}

/* schedule */
.group-h{display:flex;align-items:baseline;gap:10px;margin:20px 0 8px;font-family:var(--f-display);font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.group-h:first-child{margin-top:4px}
.group-h b{font-family:var(--f-mono);font-weight:500;letter-spacing:0}
.pm{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 16px;align-items:center;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:10px;padding:12px 14px}
.pm+.pm{margin-top:6px}
.pm-title{font-weight:600}
.pm-meta{color:var(--muted);font-size:13px;display:flex;flex-wrap:wrap;gap:4px 12px}
.pm-actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:640px){.pm{grid-template-columns:1fr}.pm-actions{justify-content:flex-start}}
.interval{font-family:var(--f-mono);font-size:12px;color:var(--steel)}

/* equipment */
.eq-grid{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.eq{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.eq:hover{border-color:var(--muted)}
.eq-top{display:flex;align-items:center;gap:8px}
.eq-code{font-family:var(--f-mono);font-size:13px;color:var(--steel);font-weight:500}
.crit-badge{margin-left:auto;font:700 12px/1 var(--f-display);width:22px;height:22px;border-radius:5px;display:grid;place-items:center;background:var(--surface-2);color:var(--muted)}
.crit-badge.A{background:color-mix(in srgb,var(--crit) 16%,transparent);color:var(--crit)}
.crit-badge.B{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.eq-name{font-weight:600;line-height:1.3}
.eq-stats{display:flex;gap:14px;font-size:12px;color:var(--muted)}
.eq-stats b{color:var(--ink);font-variant-numeric:tabular-nums}

/* dashboard */
.kpis{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:16px}
@media (min-width:1100px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;text-align:left}
.kpi .k-l{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.kpi .k-v{font-family:var(--f-display);font-size:36px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .k-s{font-size:12px;color:var(--muted)}
.kpi.alert .k-v{color:var(--crit)}
.dash{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.panel h2{font-size:18px;margin-bottom:12px}
.bars{display:flex;flex-direction:column;gap:9px}
.bar-row{display:grid;grid-template-columns:110px minmax(0,1fr) 34px;gap:10px;align-items:center;font-size:13px}
.bar-row span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-track{height:12px;background:var(--surface-2);border-radius:3px;overflow:hidden;display:flex}
.bar-track i{display:block;height:100%}
.bar-row b{text-align:right;font-variant-numeric:tabular-nums}

/* drawer + sheet */
.backdrop{position:fixed;inset:0;background:rgba(10,18,24,.45);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,100%);background:var(--bg);z-index:41;display:flex;flex-direction:column;box-shadow:var(--shadow);padding-top:env(safe-area-inset-top,0px)}
.dr-head{background:var(--surface);border-bottom:1px solid var(--line);padding:14px 16px;display:flex;gap:10px;align-items:flex-start}
.dr-head .grow{flex:1;min-width:0}
.dr-head h2{font-size:22px;line-height:1.2;overflow-wrap:anywhere}
.dr-body{overflow:auto;padding:16px;display:flex;flex-direction:column;gap:16px;padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
.statusbar{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.statusbar button{border:0;background:none;padding:9px 4px;font-size:13px;font-weight:600;color:var(--muted)}
.statusbar button+button{border-left:1px solid var(--line)}
.statusbar button[aria-pressed="true"]{background:var(--c);color:#fff}
.statusbar button:disabled{cursor:not-allowed}
.statusbar button:disabled:not([aria-pressed="true"]){opacity:.45}
.confirm-box{background:color-mix(in srgb,var(--ok) 10%,var(--surface));border:1px solid color-mix(in srgb,var(--ok) 45%,var(--line));border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.confirm-box p{margin:0;font-size:14px}
.confirm-box strong{color:var(--warn)}
.locked-note{display:flex;gap:8px;align-items:center;margin:-6px 0 0;font-size:13px;color:var(--muted)}
.locked-note .ico{width:16px;height:16px;flex:none}

const TR={on:(()=>{try{return localStorage.getItem('mp-tr')!=='off'}catch{return true}})(),cache:{},skip:new Set(),busy:false,timer:null,denied:false,stopped:false,sample:null,origTk:null};

        const doc={lang:target,kind:d.kind,ref:d.id,f:{...prev.f,...d.f}};
        TR.cache[key]=doc;
        if(S.db&&S.canWrite){try{await S.db.doc('i18n/'+key).set(doc)}catch{}}
      }
      renderAll();
    }
  }finally{TR.busy=false;renderTrChip()}
  if(LANG!==target||trUnits().length&&!TR.denied&&!TR.stopped) queueTr();
}

/* ---------- filtering ---------- */
function filtered(st=S.f.status){
  const f=S.f,q=f.q.trim().toLowerCase();
  return S.tk.filter(x=>{
    if(st==='active'&&x.status==='done') return false;
    if(st==='done'&&x.status!=='done') return false;
    if(st==='overdue'&&!isOverdue(x)) return false;
    if(st==='progress'&&x.status!=='progress') return false;
    if(st==='unsigned'&&!needsSig(x)) return false;
    if(f.resp==='none'&&x.respId) return false;
    if(f.resp==='me'&&!(myPerson()&&(x.respId===myPerson().id||x.apprId===myPerson().id))) return false;
    if(!['all','none','me'].includes(f.resp)&&x.respId!==f.resp&&x.apprId!==f.resp) return false;
    if(f.prio!=='all'&&x.priority!==f.prio) return false;
    if(f.kind!=='all'&&x.kind!==f.kind) return false;
    const e=eqById(x.assetId);
    if(f.zone!=='all'&&e?.zone!==f.zone) return false;
    if(q&&!`${x.title} ${trT(x)} ${x.no} ${e?.code||''} ${e?.name||''} ${x.crew||''} ${tv(x.crew)||''} ${x.category||''} ${tv(x.category)||''}`.toLowerCase().includes(q)) return false;
    return true;
  }).sort((a,b)=>(a.status==='done')-(b.status==='done')||(PRIO[b.priority]?.n||0)-(PRIO[a.priority]?.n||0)||String((a.due||'9')+(a.dueTime||'99')).localeCompare(String((b.due||'9')+(b.dueTime||'99'))));
}

/* layout grid: 12 columns (A–L) × 8 rows (1–8); a work order's grid cell is shown in its details and reports */
const GRID={c:12,r:8};
const gridRef=(x,y)=>x==null?'':String.fromCharCode(65+Math.max(0,Math.min(GRID.c-1,Math.floor(x/100*GRID.c))))+(Math.max(0,Math.min(GRID.r-1,Math.floor(y/100*GRID.r)))+1);
const tkGrid=x=>{const p=tkPos(x);return p?gridRef(p[0],p[1]):''};
function gridHtml(){return `<div class="plan-grid" aria-hidden="true">${Array.from({length:GRID.c},(_,i)=>`<span style="left:${(i+.5)/GRID.c*100}%;top:0">${String.fromCharCode(65+i)}</span>`).join('')}${Array.from({length:GRID.r},(_,j)=>`<span class="r" style="top:${(j+.5)/GRID.r*100}%;left:0">${j+1}</span>`).join('')}</div>`}
const PIN_RANK={done:0,hold:1,open:2,progress:3};
const pinRank=x=>(PIN_RANK[x.status]??2)+(x.priority==='critical'&&x.status!=='done'?2:0);
function pinLayout(list,aspect=.62,near=1.8){
  const pts=list.map(x=>{const p=tkPos(x);return p?{x,px:p[0],py:p[1]}:null}).filter(Boolean);
  const par=pts.map((_,i)=>i),find=i=>par[i]===i?i:(par[i]=find(par[i]));
  for(let i=0;i<pts.length;i++)for(let j=i+1;j<pts.length;j++){const a=pts[i],b=pts[j];if(Math.hypot(a.px-b.px,(a.py-b.py)*aspect)<near)par[find(i)]=find(j)}
  const groups={};pts.forEach((p,i)=>(groups[find(i)]??=[]).push(p));
  const out=[];
  Object.values(groups).forEach(g=>{
    const cx=g.reduce((a,p)=>a+p.px,0)/g.length,cy=g.reduce((a,p)=>a+p.py,0)/g.length;
    g.sort((a,b)=>pinRank(b.x)-pinRank(a.x)||String(a.x.no).localeCompare(String(b.x.no)));
    g.forEach((p,i)=>out.push(g.length>1?{x:p.x,px:cx,py:cy,i,n:g.length}:{x:p.x,px:p.px,py:p.py,i:0,n:1}));
  });
  /* draw low-rank first so in-progress and critical pins end up on top */
  return out.sort((a,b)=>pinRank(a.x)-pinRank(b.x));
}

function vDashboard(){
  const open=S.tk.filter(x=>x.status!=='done'),over=open.filter(isOverdue),crit=open.filter(x=>x.priority==='critical');
  const pmSoon=S.pm.filter(p=>pmState(p).k==='soon').length,pmOver=S.pm.filter(p=>pmState(p).k==='over').length;
  const compliance=S.pm.length?Math.round((S.pm.length-pmOver)/S.pm.length*100):null;
  const doneMonth=S.tk.filter(x=>x.status==='done'&&x.closedAt&&daysBetween(x.closedAt.slice(0,10),today())<=30).length;
  const barSet=(keys,fn)=>{const rows=keys.map(k=>[k,open.filter(x=>fn(x)===k)]).filter(r=>r[1].length);const max=Math.max(1,...rows.map(r=>r[1].length));
    return rows.length?`<div class="bars">${rows.sort((a,b)=>b[1].length-a[1].length).map(([k,ts])=>`<div class="bar-row"><span title="${esc(tv(k))}">${esc(tv(k))}</span><span class="bar-track">${['critical','high','medium','low'].map(p=>{const n=ts.filter(x=>x.priority===p).length;return n?`<i style="width:${n/max*100}%;background:${PRIO[p].c}" title="${esc(prL(p))}: ${n}"></i>`:''}).join('')}</span><b>${ts.length}</b></div>`).join('')}</div>`:`<p class="sub" style="color:var(--muted)">${esc(t('d.noOpen'))}</p>`};
  const legend=`<div class="plan-foot" style="padding:12px 0 0;border:0">${Object.entries(PRIO).map(([k,v])=>`<span class="lg"><i style="background:${v.c};border-radius:2px"></i>${esc(prL(k))}</span>`).join('')}</div>`;
  const since=addDays(today(),-30);
  const lab30=S.tk.flatMap(x=>(x.labour||[]).filter(l=>l.date>=since).map(l=>({t:x,mh:l.people*l.hours})));
  const mat30=S.tk.flatMap(x=>(x.materials||[]).filter(m=>(m.date||'')>=since).map(m=>({t:x,m,cost:(+m.qty||0)*(+m.cost||0)})));
  const mhBy=(keys,fn)=>{const rows=keys.map(k=>[k,lab30.filter(r=>fn(r.t)===k).reduce((a,r)=>a+r.mh,0)]).filter(r=>r[1]>0).sort((a,b)=>b[1]-a[1]);const max=Math.max(1,...rows.map(r=>r[1]));
    return rows.length?`<div class="bars">${rows.map(([k,v])=>`<div class="bar-row"><span title="${esc(tv(k))}">${esc(tv(k))}</span><span class="bar-track"><i style="width:${v/max*100}%;background:var(--steel)"></i></span><b>${fmtDur(v)}</b></div>`).join('')}</div>`:`<p style="color:var(--muted)">${esc(t('d.noMh'))}</p>`};
  const matTop=Object.values(mat30.reduce((a,r)=>{const k=r.m.name+'|'+r.m.unit;(a[k]??={name:r.m.name,unit:r.m.unit,qty:0,cost:0,tid:r.t.id,mid:r.m.id});a[k].qty+=+r.m.qty||0;a[k].cost+=r.cost;return a},{})).sort((a,b)=>b.cost-a.cost||b.qty-a.qty).slice(0,8);
  const kpi=(l,v,s,alert,act,id)=>`<button class="kpi${alert?' alert':''}" ${act?`data-act="${act}" data-id="${id}"`:''}><div class="k-l">${esc(t(l))}</div><div class="k-v">${v}</div><div class="k-s">${esc(s)}</div></button>`;
  const zoneOf=x=>eqById(x.assetId)?.zone||'Unassigned';
  return topbar(esc(t('nav.dashboard')),esc(t('dash.sub',{d:dLong(new Date())})),`<button class="btn primary" data-act="gen-open">${ico('doc')}${esc(t('gr.btn'))}</button>`)+
   `<div class="kpis">${kpi('k.open',open.length,t('k.openS',{n:open.filter(x=>x.status==='progress').length}),false,'go-filter','active')}
   ${kpi('k.over',over.length,t('k.overS'),over.length>0,'go-filter','overdue')}
   ${kpi('k.crit',crit.length,t('k.critS'),crit.length>0,'go-filter','critical')}
   ${kpi('k.pmDue',pmSoon,t('k.pmDueS',{n:pmOver}),pmOver>0,'view','schedule')}
   ${kpi('k.pmOn',compliance==null?'—':compliance+'%',t('k.pmOnS'),compliance!=null&&compliance<85,'view','schedule')}
   ${kpi('k.closed',doneMonth,t('k.closedS'),false)}
   ${kpi('k.unsigned',S.tk.filter(needsSig).length,t('k.unsignedS'),S.tk.some(needsSig),'go-filter','unsigned')}
   ${kpi('k.mh',fmtDur(lab30.reduce((a,r)=>a+r.mh,0)),t('k.mhS',{n:lab30.length}),false,'view','tickets')}
   ${kpi('k.mat',fmtN(Math.round(mat30.reduce((a,r)=>a+r.cost,0))),t('k.matS',{c:cur(),n:mat30.length}),false,'view','tickets')}</div>
   <div class="dash"><div class="panel"><h2>${esc(t('d.byZone'))}</h2>${barSet(zones().concat('Unassigned'),zoneOf)}${legend}</div>
   <div class="panel"><h2>${esc(t('d.byCat'))}</h2>${barSet(CATS,x=>x.category)}${legend}</div>
   <div class="panel"><h2>${esc(t('d.mhZone'))}</h2>${mhBy(zones().concat('Unassigned'),zoneOf)}</div>
   <div class="panel"><h2>${esc(t('d.mat'))}</h2>${matTop.length?`<div class="lines">${matTop.map(m=>`<div class="ln" style="grid-template-columns:minmax(0,1fr) auto"><div style="min-width:0;font-weight:600">${esc(T('tk',m.tid,'mat_'+m.mid,m.name))}</div><div class="amt">${fmtN(m.qty)} ${esc(tv(m.unit))}<small>${m.cost?fmtMoney(m.cost):esc(t('noCost'))}</small></div></div>`).join('')}</div>`:`<p style="color:var(--muted)">${esc(t('d.noMat'))}</p>`}</div>
   <div class="panel"><h2>${esc(t('d.attention'))}</h2><div class="wo-list">${[...over,...crit.filter(x=>!isOverdue(x))].slice(0,6).map(x=>woRow(x)).join('')||`<p style="color:var(--muted)">${esc(t('d.nothing'))}</p>`}</div></div></div>`;
}

async function resizeImage(file,max=1600){
  const url=URL.createObjectURL(file);
  try{const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
    const s=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);return await new Promise(r=>c.toBlob(r,'image/jpeg',.82));
  }finally{URL.revokeObjectURL(url)}
}
async function storeBlob(blob,type){
  if(!S.db){const id='m'+newId();S.memBlobs[id]=URL.createObjectURL(blob);idbPut(id,blob,'blobs');return id}

}

async function dropBlob(id){if(!id)return;if(!S.db){delete S.memBlobs[id];idbDel(id,'blobs');return}try{await S.assets?.delete(id)}catch{}}

const PDFJS='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
let pdfReady=null;
const loadScript=src=>new Promise((res,rej)=>{const el=document.createElement('script');el.src=src;el.onload=res;el.onerror=()=>rej(new Error('load'));document.head.appendChild(el)});
function loadPdfJs(){return pdfReady??=(async()=>{await loadScript(PDFJS+'pdf.worker.min.js');await loadScript(PDFJS+'pdf.min.js');window.pdfjsLib.GlobalWorkerOptions.workerSrc=PDFJS+'pdf.worker.min.js';return window.pdfjsLib})().catch(e=>{pdfReady=null;throw e})}
const isPdf=f=>f.type==='application/pdf'||/\.pdf$/i.test(f.name||'');
async function pdfRender(doc,n,maxSide){
  const page=await doc.getPage(n);const v1=page.getViewport({scale:1});
  const scale=Math.min(maxSide/Math.max(v1.width,v1.height),8);const vp=page.getViewport({scale});
  const c=document.createElement('canvas');c.width=Math.round(vp.width);c.height=Math.round(vp.height);
  const ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);
  await page.render({canvasContext:ctx,viewport:vp}).promise;return c;
}
function choosePage(doc,fname){

/* returns {img,pdf,name,page} or null */
function rotateCanvas(c,dir){const o=document.createElement('canvas');const flip=dir==='180';o.width=flip?c.width:c.height;o.height=flip?c.height:c.width;const g=o.getContext('2d');
  if(flip){g.translate(o.width,o.height);g.rotate(Math.PI)}else if(dir==='cw'){g.translate(o.width,0);g.rotate(Math.PI/2)}else{g.translate(0,o.height);g.rotate(-Math.PI/2)}g.drawImage(c,0,0);return o}
/* size of the stored layout image, cached per asset so settings can tell portrait from landscape */
const PLAN_DIMS={};
function planDims(){const id=S.site.planImg;if(!id)return null;if(PLAN_DIMS[id])return PLAN_DIMS[id];PLAN_DIMS[id]='loading';loadImg(blobSrc(id)).then(im=>{PLAN_DIMS[id]=[im.naturalWidth,im.naturalHeight];renderAll();if(S.form?.type==='settings')settingsSheet()}).catch(()=>{delete PLAN_DIMS[id]});return null}
const planPortrait=()=>{const d=planDims();return Array.isArray(d)&&d[1]>d[0]};
async function fileCanvas(file,max){const url=URL.createObjectURL(file);try{const im=await loadImg(url);const sc=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight));const c=document.createElement('canvas');c.width=Math.round(im.naturalWidth*sc);c.height=Math.round(im.naturalHeight*sc);const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(im,0,0,c.width,c.height);return c}finally{URL.revokeObjectURL(url)}}
/* the general layout is always landscape: a portrait file is turned after the user picks the direction */
function chooseRotation(c){
  return new Promise(resolve=>{
    const prev=dir=>{const r=rotateCanvas(c,dir);const sc=Math.min(1,520/r.width);const p=document.createElement('canvas');p.width=Math.round(r.width*sc);p.height=Math.round(r.height*sc);p.getContext('2d').drawImage(r,0,0,p.width,p.height);return p.toDataURL('image/jpeg',.8)};
    sheet(esc(t('rot.title')),`<div class="fld full"><p class="sig-statement">${esc(t('rot.text'))}</p>
      <div class="rot-grid">${['ccw','cw'].map(d=>`<button type="button" class="rot-opt" data-act="rot-pick" data-id="${d}"><img src="${prev(d)}" alt=""><span>${esc(t(d==='cw'?'rot.right':'rot.left'))}</span></button>`).join('')}</div></div>`,
      `<button type="button" class="btn ghost" data-act="close-sheet">${esc(t('btn.cancel'))}</button>`);
    S.form={type:'rot',resolve:d=>resolve(d?rotateCanvas(c,d):null)};
  });
}
async function rotateLayout(dir){
  if(!S.site.planImg)return;toast(t('ts.uploading'));
  const im=await loadImg(blobSrc(S.site.planImg));const c=document.createElement('canvas');c.width=im.naturalWidth;c.height=im.naturalHeight;c.getContext('2d').drawImage(im,0,0);
  const r=rotateCanvas(c,dir);const blob=await new Promise(res=>r.toBlob(res,'image/jpeg',.88));
  const id=await storeBlob(blob,'image/jpeg');const old=S.site.planImg;
  PLAN_DIMS[id]=[r.width,r.height];
  await Store.set('meta/site',{...S.site,planImg:id,planRot:((S.site.planRot||0)+(dir==='cw'?90:dir==='180'?180:270))%360});
  const tr=(x,y)=>dir==='180'?[+(100-x).toFixed(2),+(100-y).toFixed(2)]:dir==='cw'?[+(100-y).toFixed(2),x]:[y,+(100-x).toFixed(2)];
  for(const e of S.eq.filter(e=>e.x!=null)){const [nx,ny]=tr(e.x,e.y);await Store.update('equipment/'+e.id,{x:nx,y:ny})}
  for(const x of S.tk.filter(x=>x.x!=null)){const [nx,ny]=tr(x.x,x.y);await Store.update('tickets/'+x.id,{x:nx,y:ny})}

async function importPlanFile(file,maxSide,opts={}){
  let blob,page=null,pdfFile=null;
  if(isPdf(file)){
    toast(t('ts.readingPdf'));
    let lib,doc;
    try{lib=await loadPdfJs()}catch{toast(t('ts.pdfLib'));return null}
    try{doc=await lib.getDocument({data:new Uint8Array(await file.arrayBuffer()),isEvalSupported:false}).promise}catch(e){console.error(e);toast(t('ts.pdfBad'));return null}
    page=await choosePage(doc,file.name);
    if(S.form?.type==='page'){S.form.resolve=null;closeSheet()}
    if(!page)return null;
    toast(t('ts.renderingPdf'));
    let c;try{c=await pdfRender(doc,page,maxSide)}catch(e){console.error(e);toast(t('ts.pdfBad'));return null}
    if(opts.landscape&&c.height>c.width){c=await chooseRotation(c);if(!c)return null}
    blob=await new Promise(r=>c.toBlob(r,'image/jpeg',.86));
    pdfFile=file;
  } else if(opts.landscape){let c=await fileCanvas(file,maxSide);if(c.height>c.width){c=await chooseRotation(c);if(!c)return null}blob=await new Promise(r=>c.toBlob(r,'image/jpeg',.86))}
  else blob=await resizeImage(file,maxSide);
  toast(t('ts.uploading'));
  const img=await storeBlob(blob,'image/jpeg');
  let pdf=null;
  if(pdfFile){if(pdfFile.size<=20*1024*1024){try{pdf=await storeBlob(pdfFile,'application/pdf')}catch{}}else toast(t('ts.pdfBig'))}
  return {img,pdf,name:file.name||'',page};
}

function initPad(){
  const c=$('#sigPad');if(!c)return;const f=S.form;
  const fit=()=>{const r=c.getBoundingClientRect(),dpr=window.devicePixelRatio||1;c.width=Math.round(r.width*dpr);c.height=Math.round(r.height*dpr);redraw()};
  const g=c.getContext('2d');
  const redraw=()=>{g.clearRect(0,0,c.width,c.height);g.lineCap='round';g.lineJoin='round';g.lineWidth=Math.max(2,c.width/260);g.strokeStyle=getComputedStyle(c).color;
    for(const s of f.strokes){g.beginPath();for(let i=0;i<s.length;i+=2){const px=s[i]/1000*c.width,py=s[i+1]/350*c.height;i?g.lineTo(px,py):g.moveTo(px,py)}if(s.length===2)g.lineTo(s[0]/1000*c.width+0.1,s[1]/350*c.height);g.stroke()}};
  let cur=null;
  const pt=ev=>{const r=c.getBoundingClientRect();return [Math.round(Math.min(1,Math.max(0,(ev.clientX-r.left)/r.width))*1000),Math.round(Math.min(1,Math.max(0,(ev.clientY-r.top)/r.height))*350)]};
  c.addEventListener('pointerdown',ev=>{ev.preventDefault();c.setPointerCapture(ev.pointerId);cur=pt(ev);f.strokes.push(cur);redraw()});
  c.addEventListener('pointermove',ev=>{if(!cur)return;const [px,py]=pt(ev);const lx=cur[cur.length-2],ly=cur[cur.length-1];if(Math.hypot(px-lx,py-ly)<3)return;cur.push(px,py);redraw()});
  const end=()=>{if(!cur)return;cur=null;const b=$('#sigSave');if(b)b.disabled=!f.strokes.length};
  c.addEventListener('pointerup',end);c.addEventListener('pointercancel',end);
  fit();
}

async function exportReport(id){

const PERIODS=[['7',7],['30',30],['90',90],['month',null],['year',null],['all',null]];
function periodRange(k){
  const td=today();
  if(k==='all')return {from:null,to:td};
  if(k==='month')return {from:td.slice(0,8)+'01',to:td};
  if(k==='year')return {from:td.slice(0,5)+'01-01',to:td};
  return {from:addDays(td,-(+k-1)),to:td};
}

const HPD=8; /* MS Project default working hours per day */

}

  let m=/^(\d{4})-(\d{2})-(\d{2})(?:[T\s](\d{1,2}):(\d{2}))?/.exec(s);
  if(m){[y,mo,d]=[+m[1],+m[2],+m[3]];if(m[4]!=null){h=+m[4];mi=+m[5]}}
  else if((m=/^(\d{1,2})\.(\d{1,2})\.(\d{2,4})(?:\s+(\d{1,2}):(\d{2}))?/.exec(s))){d=+m[1];mo=+m[2];y=+m[3];if(m[4]!=null){h=+m[4];mi=+m[5]}}
  else if((m=/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})(?:\s+(\d{1,2}):(\d{2})\s*([ap]\.?m\.?)?)?/i.exec(s))){let a=+m[1],b=+m[2];if(a>12){d=a;mo=b}else{mo=a;d=b}y=+m[3];if(m[4]!=null){h=+m[4];mi=+m[5];const ap=(m[6]||'').toLowerCase();if(ap.startsWith('p')&&h<12)h+=12;if(ap.startsWith('a')&&h===12)h=0}}
  else return null;

  const asg={};sec('Assignments').forEach(a=>{const tu=kid(a,'TaskUID'),ru=kid(a,'ResourceUID');(asg[tu]??={names:[],work:0});if(res[ru])asg[tu].names.push(res[ru]);asg[tu].work+=isoDur(kid(a,'Work'))});

/* ---------- shared server mode: Supabase (GitHub Pages / own hosting) ----------
   Used only outside Claude, when config.js provides supabaseUrl + supabaseAnonKey.
   Data lives in one table "docs" (path → JSON), files in the private bucket "files".
   Access is enforced on the server by the rules in supabase-setup.sql. */
const SB_LIBS=['https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.100.1/dist/umd/supabase.js','https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js'];
const sbCfg=()=>{const c=window.MP_CONFIG||{};const url=String(c.supabaseUrl||'').trim().replace(/\/(rest|auth|storage|realtime)\/v1\/?.*$/,'').replace(/\/+$/,''),key=String(c.supabaseAnonKey||'').trim();return url&&key?{supabaseUrl:url,supabaseAnonKey:key}:null};
async function sbLib(){if(window.supabase?.createClient)return window.supabase;for(const u of SB_LIBS){try{await loadScript(u);if(window.supabase?.createClient)return window.supabase}catch{}}throw new Error('lib')}
const sbErr=e=>{const x=new Error(e?.message||'error');x.code=(e?.code==='42501'||/row-level security|violates|permission denied|unauthorized/i.test(e?.message||''))?'invalid_argument':(e?.code||'sb');return x};
const colOf=p=>p.split('/').slice(0,-1).join('/');
function sbDb(sb){
  const cache=new Map(),listeners=new Set(),loaded=new Set(),loading=new Map();
  async function loadCol(c,force){
    if(loaded.has(c)&&!force)return; if(loading.has(c))return loading.get(c);
    const pr=(async()=>{const rows=[];for(let from=0;;from+=1000){const {data,error}=await sb.from('docs').select('path,data').eq('col',c).range(from,from+999);if(error)throw sbErr(error);rows.push(...data);if(data.length<1000)break}
      for(const k of [...cache.keys()])if(colOf(k)===c)cache.delete(k);rows.forEach(r=>cache.set(r.path,r.data));loaded.add(c)})();
    loading.set(c,pr);try{await pr}finally{loading.delete(c)}
  }
  const snapCol=(c,order)=>{const docs=[...cache].filter(([k])=>colOf(k)===c).map(([k,v])=>({id:k.split('/').pop(),data:()=>v}));if(order)docs.sort((a,b)=>String(a.data()[order]??'')<String(b.data()[order]??'')?-1:1);return {docs}};
  const fire=l=>{try{l.col!=null?l.cb(snapCol(l.col,l.order)):l.cb({exists:cache.has(l.doc),data:()=>cache.get(l.doc)})}catch(e){console.error(e)}};
  const emit=c=>{for(const l of listeners)if(l.col===c||(l.doc&&colOf(l.doc)===c))fire(l)};
  const listen=(l,c,eb)=>{listeners.add(l);loadCol(c).then(()=>listeners.has(l)&&fire(l),e=>eb?.(e));return()=>listeners.delete(l)};
  let subscribed=false;
  const ch=sb.channel('mp-docs').on('postgres_changes',{event:'*',schema:'public',table:'docs'},pl=>{
    if(pl.eventType==='DELETE'){const k=pl.old?.path;if(!k||!cache.has(k))return;cache.delete(k);emit(colOf(k));return}
    const r=pl.new;if(!r?.path||!loaded.has(r.col))return;cache.set(r.path,r.data);emit(r.col);
  }).subscribe(st=>{
    if(st==='SUBSCRIBED'){if(subscribed){[...loaded].forEach(c=>loadCol(c,true).then(()=>emit(c),()=>{}))}subscribed=true;S.sbOnline=true}
    else if(st==='CHANNEL_ERROR'||st==='TIMED_OUT'||st==='CLOSED'){S.sbOnline=false}
  });
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')[...loaded].forEach(c=>loadCol(c,true).then(()=>emit(c),()=>{}))});
  const optimistic=async(k,next,send)=>{const c=colOf(k),had=cache.has(k),prev=cache.get(k);if(next===undefined)cache.delete(k);else cache.set(k,next);emit(c);
    try{await send()}catch(e){if(had)cache.set(k,prev);else cache.delete(k);emit(c);throw e}};
  const doc=k=>({
    set:d=>optimistic(k,d,async()=>{const {error}=await sb.from('docs').upsert({path:k,col:colOf(k),data:d});if(error)throw sbErr(error)}),
    update:d=>optimistic(k,{...(cache.get(k)||{}),...d},async()=>{const {error}=await sb.rpc('mp_merge',{p:k,c:colOf(k),d});if(error)throw sbErr(error)}),
    delete:()=>optimistic(k,undefined,async()=>{const {data,error}=await sb.from('docs').delete().eq('path',k).select('path');if(error)throw sbErr(error);if(!data?.length){const {data:still}=await sb.from('docs').select('path').eq('path',k);if(still?.length)throw sbErr({code:'42501'})}}),
    onSnapshot:(cb,eb)=>listen({doc:k,cb},colOf(k),eb)
  });
  const collection=c=>{const mk=order=>({orderBy:f=>mk(f),onSnapshot:(cb,eb)=>listen({col:c,cb,order},c,eb)});return mk(null)};
  const bulk=async rows=>{for(let i=0;i<rows.length;i+=100){const {error}=await sb.from('docs').upsert(rows.slice(i,i+100));if(error)throw sbErr(error)}rows.forEach(r=>{if(loaded.has(r.col))cache.set(r.path,r.data)});[...new Set(rows.map(r=>r.col))].forEach(emit)};
  return {doc,collection,bulk,cache,channel:ch};
}
/* files: private bucket; the app shows them through short-lived signed links */
const SIGN={want:new Set(),bad:new Set(),timer:null};
function sbWant(id){if(!id||S.memBlobs[id]||SIGN.bad.has(id)||SIGN.want.has(id))return;SIGN.want.add(id);clearTimeout(SIGN.timer);SIGN.timer=setTimeout(sbSign,25)}
async function sbSign(){const ids=[...SIGN.want];SIGN.want.clear();if(!ids.length||!S.sb)return;
  try{const {data,error}=await S.sb.storage.from('files').createSignedUrls(ids,7*86400);if(error)throw error;let n=0;
    for(const r of data||[]){if(r.signedUrl&&!r.error){S.memBlobs[r.path]=r.signedUrl;n++}else if(r.path)SIGN.bad.add(r.path)}if(n)renderAll()}catch(e){console.warn('sign',e)}}
function sbScan(){if(!S.sb)return;const add=id=>{if(id&&!S.memBlobs[id])sbWant(id)};add(S.site?.planImg);add(S.site?.planPdf);
  S.eq.forEach(e=>{add(e.drawing?.img);add(e.drawing?.pdf)});S.tk.forEach(x=>(x.photos||[]).forEach(add))}
const sbAssets=sb=>({
  upload:async(blob,{type}={})=>{const id=(crypto.randomUUID?crypto.randomUUID():newId()+newId()).replace(/-/g,'');const {error}=await sb.storage.from('files').upload(id,blob,{contentType:type||blob.type||'application/octet-stream',upsert:false});if(error)throw sbErr(error);S.memBlobs[id]=URL.createObjectURL(blob);return {id}},
  delete:async id=>{await sb.storage.from('files').remove([id])}
});

  });

async function sbBoot(){
  const cfg=sbCfg();let lib;
  try{lib=await sbLib()}catch{toast(t('lg.noLib'),10000);return null}
  const sb=lib.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey,{auth:{persistSession:true,autoRefreshToken:true}});
  let {data:{session}}=await sb.auth.getSession();
  if(!session)session=await sbLogin(sb);
  sb.auth.onAuthStateChange((ev)=>{if(ev==='SIGNED_OUT')location.reload()});
  S.sb=sb;S.sbEmail=(session.user.email||'').toLowerCase();
  const db=sbDb(sb);
  db.collection('users').onSnapshot(s=>{s.docs.forEach(d=>{const v=d.data();S.names[d.id]=v.name||v.email||''});renderAll()},()=>{});
  return {db,user:sbUser(sb,session,db),assets:sbAssets(sb),dl:localDownloads,session};
}
/* translation outside Claude: the "translate" Edge Function on your Supabase project (see README) */
function sbTranslator(){return {translate:async(target,items)=>{
  const {data,error}=await S.sb.functions.invoke('translate',{body:{target,items}});
  if(error||!data?.result){let msg=error?.message||data?.error||'no result';try{const b=await error?.context?.json?.();if(b?.error)msg=b.error}catch{}
    TR.err=msg;console.warn('translate:',msg);const x=new Error(msg);x.code='unavailable';throw x}
  TR.err=null;return data.result}}}
async function sbSignOut(){try{await S.sb.auth.signOut()}catch{}location.reload()}
async function sbChangePass(){
  const p1=prompt(t('lg.newPass'));if(!p1)return;if(p1.length<8){toast(t('lg.short'));return}
  const {error}=await S.sb.auth.updateUser({password:p1});toast(error?(error.message||t('lg.bad')):t('lg.passOk'));
}
async function sbImport(j){
  const files=Object.entries(j.files||{}),docs=Object.entries(j.docs||{});let n=0;
  for(const [id,url] of files){toast(t('bk.upFiles',{n:++n,t:files.length}),60000);
    const bl=await (await fetch(url)).blob();const {error}=await S.sb.storage.from('files').upload(id,bl,{contentType:bl.type||'application/octet-stream',upsert:true});
    if(error)throw sbErr(error);S.memBlobs[id]=URL.createObjectURL(bl);SIGN.bad.delete(id)}
  if(docs.length){toast(t('bk.upDocs',{n:docs.length}),60000);await S.db.bulk(docs.map(([k,v])=>({path:k,col:colOf(k),data:v})))}
  return docs.length;
}

/* ---------- boot ---------- */
document.documentElement.lang=LANG;
renderAll();
(async()=>{
  const use=n=>window.claude?.use?window.claude.use(n).catch(()=>null):Promise.resolve(null);
  let [db,user,assets,dl]=await Promise.all([use('db'),use('user'),use('assets'),use('downloads')]);
  if(!window.claude?.use&&sbCfg()){const r=await sbBoot();if(!r){S.ready=true;renderAll();return}({db,user,assets,dl}=r)}
  S.db=db;S.user=user;S.assets=assets;S.dl=dl;
  S.baseCanWrite=true;
  if(user){S.me=await user.me();S.isOwner=await user.isOwner();if(S.sb){Store.set('users/'+S.me.id,{email:S.me.email,name:S.me.name,lastSeen:nowIso()}).catch?.(()=>{})}const cw=await user.can('data.write');if(cw===false)S.baseCanWrite=false;applyAccess();if(S.me?.id){S.names[S.me.id]=S.me.name||'';S.avatars[S.me.id]=S.me.avatarUrl}}
  if(!db){
    if(!window.claude?.use){S.local=true;S.dl=S.dl||localDownloads;try{await idbLoadAll()}catch(e){console.warn('IndexedDB unavailable',e);S.local=false}}
    S.ready=true;S.live=false;memNotify();return}
  S.live=true;
  const loaded={eq:0,tk:0,pm:0};
  const sub=(col,key)=>db.collection(col).onSnapshot(s=>{S[key]=s.docs.map(d=>({id:d.id,...d.data()}));loaded[key]=1;S.ready=loaded.eq&&loaded.tk&&loaded.pm;renderAll()},e=>{console.error(e);toast(t('ts.lost'))});
  sub('equipment','eq');sub('tickets','tk');sub('pm','pm');
  db.collection('people').onSnapshot(s=>{setPeople(s.docs.map(d=>({id:d.id,...d.data()})));applyAccess();
    if(S.sb&&S.me){const mp=myPerson();if(mp&&mp.name!==S.me.name){S.me.name=mp.name;S.names[S.me.id]=mp.name;if(S.canWrite||mp)S.db.doc('users/'+S.me.id).update({name:mp.name}).catch(()=>{})}}
    renderAll()},()=>{});
  db.collection('signatures').onSnapshot(s=>{S.sig=s.docs.map(d=>({id:d.id,...d.data()}));renderAll()},()=>{});
  db.collection('notifications').onSnapshot(s=>{onNotes(s.docs.map(d=>({id:d.id,...d.data()})));renderAll()},()=>{});
  db.doc('meta/site').onSnapshot(s=>{S.site=s.exists?s.data():{};renderAll()},()=>{});
  db.collection('i18n').onSnapshot(s=>{const c={};s.docs.forEach(d=>{c[d.id]=d.data()});for(const [k,v] of Object.entries(TR.cache))if(!(k in c))c[k]=v;TR.cache=c;renderAll()},()=>{});
})();
